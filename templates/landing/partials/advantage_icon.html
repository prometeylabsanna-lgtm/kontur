{% if icon and icon != 'none' %}
<span class="adv-card__icon" aria-hidden="true">
  {% if icon == 'price' %}
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="7" y="5" width="18" height="22" rx="1.5"/>
    <path d="M11 11h10M11 15h10M11 19h6"/>
  </svg>
  {% elif icon == 'package' %}
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M6 12l10-5 10 5v10l-10 5-10-5V12z"/>
    <path d="M6 12l10 5 10-5M16 17v10"/>
  </svg>
  {% elif icon == 'calendar' %}
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="6" y="8" width="20" height="18" rx="1.5"/>
    <path d="M6 13h20M11 6v4M21 6v4M12 18h8M12 22h5"/>
  </svg>
  {% elif icon == 'shield' %}
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M16 5l9 4v7c0 5.5-3.8 9.5-9 11-5.2-1.5-9-5.5-9-11V9l9-4z"/>
    <path d="M12.5 16.5l2.5 2.5 4.5-5"/>
  </svg>
  {% elif icon == 'pin' %}
  <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M16 27s-8-7.2-8-13a8 8 0 1116 0c0 5.8-8 13-8 13z"/>
    <circle cx="16" cy="14" r="2.75"/>
  </svg>
  {% endif %}
</span>
{% endif %}
