{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Kontur+ — ремонт під ключ в Одесі{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Ремонт квартир під ключ в Одесі з фіксованою ціною за м². Пакети, дизайн, калькулятор вартості.{% endblock %}" />
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components-1.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components-2.css' %}" />
  <link rel="stylesheet" href="{% static 'css/sections-1.css' %}" />
  <link rel="stylesheet" href="{% static 'css/sections-1b.css' %}" />
  <link rel="stylesheet" href="{% static 'css/sections-2.css' %}" />
  <link rel="stylesheet" href="{% static 'css/sections-2b.css' %}" />
  <link rel="stylesheet" href="{% static 'css/calc.css' %}" />
  <link rel="stylesheet" href="{% static 'css/cases.css' %}" />
  <link rel="stylesheet" href="{% static 'css/reviews.css' %}" />
  <link rel="stylesheet" href="{% static 'css/footer.css' %}" />
  <link rel="stylesheet" href="{% static 'css/cookie-consent.css' %}" />
  <link rel="stylesheet" href="{% static 'css/motion.css' %}" />
  <link rel="stylesheet" href="{% static 'css/privacy.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% include "landing/partials/cookie_consent.html" %}
  <script src="{% static 'js/motion.js' %}" defer></script>
  <script src="{% static 'js/cookie-consent.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
