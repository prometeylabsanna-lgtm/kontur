# HTTPS for konturplus.com.ua after DNS + certbot.
# Set NGINX_CONF=docker.prod.conf in server .env and re-run deploy.sh.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name konturplus.com.ua www.konturplus.com.ua _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name konturplus.com.ua www.konturplus.com.ua _;
    client_max_body_size 32M;

    ssl_certificate /etc/letsencrypt/live/konturplus.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konturplus.com.ua/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
