# Nginx for Kontur+ on DigitalOcean droplet
# Copy to /etc/nginx/sites-available/kontur and symlink sites-enabled
# Replace YOUR_DOMAIN and enable certbot after first HTTP deploy

upstream kontur_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 32M;

    location /static/ {
        alias /var/www/kontur/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/kontur/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://kontur_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
